name: Refresh Z47'47 feed

# Index: hourly Mon–Fri. Companies: once daily after close + manual run.
on:
  schedule:
    - cron: "30 4-9 * * 1-5"
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: z47-feed
  cancel-in-progress: false

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python3 -m pip install --quiet --upgrade yfinance
      - name: Build index feed
        env:
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
        run: python3 build_z47_json.py --write-history
      - name: Commit index if changed
        run: |
          git config user.name  "z47-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add z47_index.json z47_history.csv
          if git diff --staged --quiet; then
            echo "No index changes."
          else
            git commit -m "data: refresh Z47 index ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git pull --rebase origin main
            git push
          fi

  refresh-companies:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 10 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python3 -m pip install --quiet --upgrade yfinance
      - name: Build all company pages (Screener + Yahoo)
        env:
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
        run: python3 scripts/build_company_hero.py --sleep 0.55
      - name: Commit companies if changed
        run: |
          git config user.name  "z47-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies/
          if git diff --staged --quiet; then
            echo "No company JSON changes."
          else
            git commit -m "data: refresh all company pages from Screener ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git pull --rebase origin main
            git push
          fi
