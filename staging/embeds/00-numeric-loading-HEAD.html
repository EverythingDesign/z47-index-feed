<style>
/* Install in the page HEAD, before the body can paint placeholder numbers. */
:is([data-z47^="card-"], [data-z47^="ret-z47-"], [data-z47^="ret-nifty-"],
    [data-z47="hero-z47-pct"], [data-z47="hero-nifty-pct"],
    [data-z47="chart-z47-pct"], [data-z47="chart-nifty-pct"]):not([data-z47-value-state]) {
  position: relative;
  visibility: hidden !important;
  min-width: 3ch;
}
:is([data-z47^="card-"], [data-z47^="ret-z47-"], [data-z47^="ret-nifty-"],
    [data-z47="hero-z47-pct"], [data-z47="hero-nifty-pct"],
    [data-z47="chart-z47-pct"], [data-z47="chart-nifty-pct"]):not([data-z47-value-state])::after {
  content: "";
  visibility: visible;
  position: absolute;
  left: 0;
  top: 20%;
  width: min(100%, 6ch);
  height: 65%;
  border-radius: 4px;
  background: #e9dfd2;
  pointer-events: none;
}
[data-z47-value-state="unavailable"] { color: #777 !important; }

</style>
<script>
/* Head companion: an unavailable feed must never reveal Designer placeholders. */
(function () {
  "use strict";
  var selector = '[data-z47^="card-"], [data-z47^="ret-z47-"], [data-z47^="ret-nifty-"], ' +
    '[data-z47="hero-z47-pct"], [data-z47="hero-nifty-pct"], ' +
    '[data-z47="chart-z47-pct"], [data-z47="chart-nifty-pct"]';
  function failPending() {
    document.querySelectorAll(selector).forEach(function (el) {
      if (el.hasAttribute("data-z47-value-state")) return;
      el.textContent = "—";
      el.setAttribute("data-z47-value-state", "unavailable");
      el.setAttribute("aria-label", "Data unavailable");
    });
  }
  var timer;
  window.addEventListener("z47:performance-state", function (event) {
    if (event.detail === "ready" || event.detail === "error") {
      clearTimeout(timer);
      failPending();
    }
  });
  function start() { timer = setTimeout(failPending, 20000); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
