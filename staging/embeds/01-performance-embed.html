<!--
  Z47 — Tab 1: Index Performance Chart
  File: staging/embeds/01-performance-embed.html
  Paste into the .chart-embed HtmlEmbed on the Index page.

  Powers: performance chart · return summary · top movers · period tabs (1M/3M/6M/1Y/YTD/Since)
  Also fills [data-z47="chart-legend"] / .chart-embed-legend (Z47 logo + NIFTY 500)

  Logic lives on GitHub (Webflow HtmlEmbed is 10k-char capped):
    staging/js/01-performance.js
  Feed: https://raw.githubusercontent.com/EverythingDesign/z47-index-feed/main/z47_index.json
  NOTE: Do NOT load JS from raw.githubusercontent.com — browsers block it (ORB).
        Use jsDelivr below. Bump ?v= after pushing JS changes.
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  .ai-color-red { color: #C8401B; }
  [data-z47="chart-canvas-wrap"] { position: relative; width: 100%; aspect-ratio: 16 / 7; }
  [data-z47-range] { cursor: pointer; }
  [data-z47-period] { cursor: pointer; }
  a.z47-co-link{color:inherit;text-decoration:none;}
  a.z47-co-link:hover{text-decoration:underline;}
  .z47-lgnd,[data-z47="chart-legend"]{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 34px;width:100%;}
  .z47-lgnd-item{display:inline-flex;align-items:center;gap:10px;}
  .z47-lgnd-sw{display:inline-block;width:28px;height:4px;border-radius:2px;flex:0 0 auto;}
  .z47-lgnd-logo{height:20px;width:auto;display:block;}
  .z47-lgnd-txt{font-size:17px;font-weight:600;color:#111;white-space:nowrap;line-height:1;}
  @media(max-width:600px){
    .z47-lgnd,[data-z47="chart-legend"]{gap:10px 22px;}
    .z47-lgnd-sw{width:22px;}
    .z47-lgnd-logo{height:16px;}
    .z47-lgnd-txt{font-size:14px;}
  }
</style>
<script src="https://cdn.jsdelivr.net/gh/EverythingDesign/z47-index-feed@main/staging/js/01-performance.js?v=20260820d"></script>
