<!--
  Z47 — Company page paint — Screener consolidated source of truth
  Updated: 2026-08-12 — Sub-Index polish (about clamp, hero align, P&L from Mar 2021, growth align)
-->
<style>.ai-color-parrotgreen{color:#249200;}.ai-color-red{color:#D31F03;}</style>
<script>
(function () {
  "use strict";
  if (!document.getElementById("z47-company-polish-css")) {
    var st = document.createElement("style");
    st.id = "z47-company-polish-css";
    (document.head || document.body).appendChild(st);
  }
  document.getElementById("z47-company-polish-css").textContent = ""
      + "[data-z47-co=\"about\"].z47-about-collapsed{"
      + "display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;"
      + "overflow:hidden;max-height:9.6em;line-height:1.6;"
      + "}"
      + "[data-z47-co=\"about\"].z47-about-open{"
      + "display:block;-webkit-line-clamp:unset;max-height:none;overflow:visible;line-height:1.6;"
      + "}"
      + ".z47-about-more{"
      + "display:inline-block;margin-top:8px;padding:0;border:0;background:none;"
      + "font:inherit;font-size:14px;font-weight:500;color:#FF6800;cursor:pointer;"
      + "text-decoration:underline;text-underline-offset:2px;"
      + "}"
      + ".z47-about-more[hidden]{display:none;}"
      + ".screener-hero-mk{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}"
      + ".screener-hero-key{flex:0 1 auto;text-align:left;}"
      + ".screener-hero-value,[data-z47-co].screener-hero-value{flex:1 1 auto;text-align:right;}"
      + ".pl-cards .pe-card-data{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;}"
      + ".pl-cards .pe-card-data .ai-tag-2{flex:1 1 auto;text-align:left;}"
      + ".pl-cards .pe-card-data .ai-tag-3{flex:0 0 auto;text-align:right;min-width:3.5em;}";

  var INDEX_URL = "https://raw.githubusercontent.com/EverythingDesign/z47-index-feed/main/z47_index.json";
  var COMPANY_URL = "https://raw.githubusercontent.com/EverythingDesign/z47-index-feed/main/data/companies/";
  var UP = "ai-color-parrotgreen", DOWN = "ai-color-red";
  var POS_COLOR = "#249200", NEG_COLOR = "#D31F03";

  function $all(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  function root() { return document.querySelector("[data-z47-company]") || document; }
  function co(k) { return $all('[data-z47-co="' + k + '"]', root()); }
  function setText(els, text) {
    els.forEach(function (el) { el.textContent = text; });
  }
  function fmtNum(n, d) {
    return Number(n).toLocaleString("en-IN", {
      minimumFractionDigits: d || 0,
      maximumFractionDigits: d == null ? 0 : d
    });
  }
  function fmtPct(n, d) {
    d = d == null ? 2 : d;
    return (n >= 0 ? "+" : "") + Number(n).toFixed(d) + "%";
  }
  function money(price, ccy) {
    if (price == null || !isFinite(price)) return "—";
    return (ccy === "USD" ? "$" : "₹") + fmtNum(price, 2);
  }
  function slugFromPath() {
    var parts = (location.pathname || "").split("/").filter(Boolean);
    var folders = { "z47-forty-seven": true, companies: true };
    var i;
    for (i = 0; i < parts.length; i++) {
      if (folders[parts[i]] && parts[i + 1]) return parts[i + 1].toLowerCase();
    }
    return "";
  }
  function resolveKey() {
    var r = document.querySelector("[data-z47-company]");
    var slug = (r && r.getAttribute("data-z47-slug")) || slugFromPath();
    var ticker = (r && r.getAttribute("data-z47-ticker")) || "";
    return { slug: (slug || "").toLowerCase(), ticker: (ticker || "").toUpperCase() };
  }
  function findConstituent(d, key) {
    var list = d.constituents || [];
    var i, c;
    if (key.slug) {
      for (i = 0; i < list.length; i++) {
        c = list[i];
        if ((c.slug || "").toLowerCase() === key.slug) return c;
        if ((c.ticker || "").toLowerCase() === key.slug) return c;
      }
    }
    if (key.ticker) {
      for (i = 0; i < list.length; i++) {
        c = list[i];
        if ((c.ticker || "").toUpperCase() === key.ticker) return c;
      }
    }
    return null;
  }
  function paintDaily(els, n) {
    els.forEach(function (el) {
      el.classList.remove(UP, DOWN);
      if (n == null || !isFinite(n)) {
        el.textContent = "—";
        el.style.color = "#9a9a9a";
        return;
      }
      el.textContent = fmtPct(n);
      el.classList.add(n >= 0 ? UP : DOWN);
      el.style.color = n >= 0 ? POS_COLOR : NEG_COLOR;
    });
  }
  function setMetricByLabel(labelRe, text) {
    $all(".screener-hero-mk", root()).forEach(function (row) {
      var key = row.querySelector(".screener-hero-key");
      var val = row.querySelector(".screener-hero-value") || row.querySelector("[data-z47-co]");
      if (!key || !val) return;
      if (labelRe.test((key.textContent || "").trim())) val.textContent = text;
    });
  }
  function setLink(coKey, href, label) {
    co(coKey).forEach(function (a) {
      if (href) {
        a.setAttribute("href", href);
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
      var tag = a.querySelector(".ai-tag-2, .uppercase, span, div");
      if (tag) tag.textContent = label;
      else {
        var kids = a.childNodes;
        var i;
        for (i = kids.length - 1; i >= 0; i--) {
          if (kids[i].nodeType === 3 && kids[i].textContent.trim()) {
            kids[i].textContent = label;
            return;
          }
        }
        a.appendChild(document.createTextNode(label));
      }
    });
  }
  function paintAbout(text) {
    co("about").forEach(function (el) {
      el.textContent = text || "";
      el.classList.add("z47-about-collapsed");
      el.classList.remove("z47-about-open");
      var parent = el.parentNode;
      if (!parent) return;
      var more = parent.querySelector(".z47-about-more");
      if (!more) {
        more = document.createElement("button");
        more.type = "button";
        more.className = "z47-about-more";
        parent.appendChild(more);
      }
      more.textContent = "Read More...";
      more.hidden = true;
      more.onclick = function () {
        var open = el.classList.contains("z47-about-open");
        el.classList.toggle("z47-about-open", !open);
        el.classList.toggle("z47-about-collapsed", open);
        more.textContent = open ? "Read More..." : "Read less";
      };
      requestAnimationFrame(function () {
        more.hidden = el.scrollHeight <= el.clientHeight + 2;
      });
    });
  }
  function paintIndex(c, meta, hasHero) {
    if (!c) return;
    // Company JSON (Screener) is source of truth when present — index is fallback only
    if (!hasHero) {
      setText(co("name"), c.name || "—");
      setText(co("price"), money(c.price, c.ccy));
      paintDaily(co("daily_pct"), c.daily_pct);
    }
    if (meta && meta.generated_at_ist && !hasHero) setText(co("as_of"), meta.generated_at_ist);
  }
  function paintHero(h, ccy) {
    if (!h) return;
    if (h.about) paintAbout(h.about);
    // Always paint — clears CMS leftovers when Screener has no PE/ratio
    // Callers: CMS company template HtmlEmbed paste of this file; also staging/js/04-company-page.js CDN copy.
    // User: "Fix the 2 and 3?" = PE leftover + ratio drift vs Screener.
    setMetricByLabel(
      /^(Stock\s*)?P\/?E$/i,
      (h.pe != null && isFinite(h.pe)) ? fmtNum(h.pe, 1) : "—"
    );
    setMetricByLabel(
      /^ROCE$/i,
      (h.roce != null && isFinite(h.roce)) ? fmtNum(h.roce, 1) + "%" : "—"
    );
    setMetricByLabel(
      /^ROE$/i,
      (h.roe != null && isFinite(h.roe)) ? fmtNum(h.roe, 1) + "%" : "—"
    );
    if (h.high != null && h.low != null && isFinite(h.high) && isFinite(h.low)) {
      var sym = ccy === "USD" ? "$" : "₹";
      setMetricByLabel(/^High\s*\/?\s*Low$/i, sym + fmtNum(h.high, 0) + " / " + fmtNum(h.low, 0));
    }
    if (h.mcap_cr != null && isFinite(h.mcap_cr)) {
      setMetricByLabel(/^Market\s*Cap$/i, "₹" + fmtNum(h.mcap_cr, 0) + " Cr.");
    }
    if (h.price != null && isFinite(h.price)) {
      setMetricByLabel(/^Current\s*Price$/i, money(h.price, ccy));
      setText(co("price"), money(h.price, ccy));
    }
    if (h.daily_pct != null && isFinite(h.daily_pct)) {
      paintDaily(co("daily_pct"), h.daily_pct);
    }
    if (h.generated_at_ist) setText(co("as_of"), h.generated_at_ist);
    if (h.website) {
      setLink("link-web", h.website, (h.website_label || h.website).toUpperCase());
    }
    if (h.bse_code) {
      setLink("link-bse", h.bse_url || "#", "BSE : " + h.bse_code);
    }
    if (h.nse_symbol) {
      setLink("link-nse", h.nse_url || "#", "NSE : " + h.nse_symbol);
    }
    if (h.name) setText(co("name"), h.name);
    paintPL(h.pl);
    paintGrowth(h.growth);
  }
  function fmtGrowthPct(n) {
    if (n == null || !isFinite(n)) return "—";
    return Number(n).toLocaleString("en-IN", {
      maximumFractionDigits: 0,
      minimumFractionDigits: 0
    }) + "%";
  }
  function paintGrowth(g) {
    if (!g || !g.cards || !g.cards.length) return;
    var byTitle = {};
    g.cards.forEach(function (c) { byTitle[c.title] = c; });

    $all(".pl-cards", root()).forEach(function (card) {
      var titleEl = card.querySelector(".text-size-xlarge");
      if (!titleEl) return;
      var title = (titleEl.textContent || "").trim();
      var data = byTitle[title];
      if (!data || !data.rows || !data.rows.length) return;

      var wrap = card.querySelector(".pe-card-data-wrap");
      if (!wrap) return;
      var tpl = wrap.querySelector(".pe-card-data");
      if (!tpl) return;

      wrap.innerHTML = "";
      data.rows.forEach(function (row) {
        var node = tpl.cloneNode(true);
        var labelEl = node.querySelector(".ai-tag-2");
        var valEl = node.querySelector(".ai-tag-3") || node.querySelector("[data-z47-co]");
        if (labelEl) labelEl.textContent = row.label || "";
        var txt = fmtGrowthPct(row.value);
        if (valEl) {
          valEl.textContent = txt;
          valEl.setAttribute(
            "data-z47-co",
            (data.key || "growth") + "_" + (row.key || "x")
          );
          if (row.value != null && isFinite(row.value) && row.value < 0) {
            valEl.style.color = NEG_COLOR;
          } else {
            valEl.style.color = "";
          }
        }
        wrap.appendChild(node);
      });
    });

    // Legacy attr names from early Webflow markup
    g.cards.forEach(function (card) {
      (card.rows || []).forEach(function (row) {
        var txt = fmtGrowthPct(row.value);
        setText(co(card.key + "_" + row.key), txt);
        if (card.key === "sales" || card.key === "profit") {
          setText(co(card.key + "_cagr_" + row.key), txt);
        }
        if (card.key === "stock") {
          setText(co("stock_cagr_" + row.key), txt);
          if (row.key === "1y") setText(co("stock_cagr_ttm"), txt);
        }
        if (card.key === "roe") {
          setText(co("roe_" + row.key), txt);
          if (row.key === "last") setText(co("roe_ttm"), txt);
        }
      });
    });
  }
  function filterPLFrom2021(pl) {
    if (!pl || !pl.periods || !pl.periods.length) return pl;
    var keep = [];
    pl.periods.forEach(function (p, i) {
      var m = String(p).match(/(19|20)\d{2}/);
      var y = m ? parseInt(m[0], 10) : 0;
      if (y >= 2021) keep.push(i);
    });
    if (!keep.length || keep.length === pl.periods.length) return pl;
    return {
      unit: pl.unit,
      consolidated: pl.consolidated,
      periods: keep.map(function (i) { return pl.periods[i]; }),
      rows: (pl.rows || []).map(function (row) {
        return {
          key: row.key,
          label: row.label,
          values: keep.map(function (i) {
            return (row.values && row.values[i] != null) ? row.values[i] : "—";
          })
        };
      })
    };
  }
  function alignCell(node, t, isLabel) {
    var align = isLabel ? "left" : "right";
    node.style.textAlign = align;
    if (t && t !== node) t.style.textAlign = align;
    if (!isLabel) {
      node.style.fontVariantNumeric = "tabular-nums";
      if (t && t !== node) t.style.fontVariantNumeric = "tabular-nums";
    }
  }
  function paintPL(pl) {
    pl = filterPLFrom2021(pl);
    if (!pl || !pl.periods || !pl.rows || !pl.rows.length) return;
    co("pl-table").forEach(function (host) {
      var wrap = host.querySelector(".constituent-summary-table.main-wrap") || host;
      var header = wrap.querySelector(".live-prices-header");
      var body = wrap.querySelector(".live-prices-list, [data-z47=\"constituents-body\"]");
      if (!header || !body) return;

      var hCells = $all(":scope > *", header);
      var bCells = $all(":scope > *", body);
      if (hCells.length < 2 || bCells.length < 2) return;
      var cols = pl.periods.length + 1; // label + years
      var hTpl = hCells.slice(0, cols).map(function (n) { return n.cloneNode(true); });
      var bTpl = bCells.slice(0, cols).map(function (n) { return n.cloneNode(true); });
      if (hTpl.length < cols || bTpl.length < cols) return;

      // Header: Company + periods
      header.innerHTML = "";
      hTpl.forEach(function (cell, i) {
        var node = cell.cloneNode(true);
        var t = node.querySelector(".summary-heading, [data-z47-cell], div");
        if (t) {
          if (i === 0) t.textContent = "Company";
          else t.textContent = pl.periods[i - 1] || "";
        }
        alignCell(node, t || node, i === 0);
        header.appendChild(node);
      });

      // Body rows
      body.innerHTML = "";
      pl.rows.forEach(function (row) {
        bTpl.forEach(function (cell, i) {
          var node = cell.cloneNode(true);
          var t = node.querySelector("[data-z47-cell], .summary-heading, .text-size-medium, div");
          if (!t) t = node;
          if (i === 0) {
            t.textContent = row.label || "";
            t.classList.add("summary-heading");
          } else {
            var v = (row.values && row.values[i - 1] != null) ? String(row.values[i - 1]) : "—";
            t.textContent = v === "" ? "—" : v;
            // mild colour for negatives
            if (/^-/.test(v)) t.style.color = NEG_COLOR;
            else t.style.color = "";
          }
          alignCell(node, t, i === 0);
          body.appendChild(node);
        });
      });

      // Webflow designer grid is often fixed at 7 cols (incl. Mar 2020).
      // After filtering to Mar 2021+, sync tracks or rows wrap mid-metric.
      var gridCols = "minmax(11em, 1.4fr) repeat(" + (cols - 1) + ", minmax(4.2em, 1fr))";
      header.style.gridTemplateColumns = gridCols;
      body.style.gridTemplateColumns = gridCols;
    });
  }
  function start() {
    var key = resolveKey();
    if (!key.slug && !key.ticker) return;
    var slug = key.slug || key.ticker.toLowerCase();
    var indexP = fetch(INDEX_URL).then(function (r) { if (!r.ok) throw 0; return r.json(); }).catch(function () { return null; });
    var heroP = fetch(COMPANY_URL + encodeURIComponent(slug) + ".json")
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .catch(function () { return null; });
    Promise.all([indexP, heroP]).then(function (pair) {
      var d = pair[0], h = pair[1];
      var c = d ? findConstituent(d, key) : null;
      if (c) paintIndex(c, d.meta || {}, !!h);
      if (h) {
        window.__Z47_COMPANY = h;
        paintHero(h, c && c.ccy);
        if (typeof window.__Z47_paintShareholding === "function" && h.shareholding) {
          window.__Z47_paintShareholding(h.shareholding);
        }
      }
      var r = document.querySelector("[data-z47-company]");
      if (r) {
        var t = (h && h.ticker) || (c && c.ticker);
        var s = (h && h.slug) || (c && c.slug) || slug;
        if (t) r.setAttribute("data-z47-ticker", t);
        if (s) r.setAttribute("data-z47-slug", s);
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
