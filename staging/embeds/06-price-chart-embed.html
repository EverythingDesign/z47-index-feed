<style>.ai-color-parrotgreen{color:#249200;}.ai-color-red{color:#D31F03;}</style>
<script>
(function (global) {
  "use strict";
  var CHART_URL = (global.__Z47_FEED_BASE || "https://raw.githubusercontent.com/EverythingDesign/z47-index-feed/main/") + "data/companies/";
  var ACTIVE = "is-active";
  var PRICE_COLOR = "#FF6800";
  var DMA50_COLOR = "#12295C";
  var DMA200_COLOR = "#103B33";
  var VOLUME_COLOR = "rgba(112, 112, 112, 0.35)";
  var PE_COLOR = "#5E1A50";

  var period = "1M";
  var seriesMode = "price"; // price | pe
  var layers = { price: true, dma50: false, dma200: false, volume: true };
  var payload = null;
  var chart = null;
  // Show a period only when Max history spans at least this many calendar days.
  // Max is always shown. 10Y only appears for long-history names.
  var TAB_ORDER = ["1M", "6M", "1Y", "3Y", "5Y", "10Y", "Max"];
  var PERIOD_MIN_DAYS = {
    "1M": 14,
    "6M": 150,
    "1Y": 300,
    "3Y": 900,
    "5Y": 1500,
    "10Y": 3000
  };

  function $all(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  function root() { return document.querySelector("[data-z47-company]") || document; }
  function canvas() {
    var host = root().querySelector('[data-z47-co="chart"]');
    if (!host) return null;
    return host.querySelector("canvas") || host;
  }
  function legendHost() {
    return root().querySelector('[data-z47="chart-legend"], .price-performance-legend');
  }
  function slugFromPath() {
    var parts = (location.pathname || "").split("/").filter(Boolean);
    var folders = { "z47-forty-seven": true, companies: true };
    var i;
    for (i = 0; i < parts.length; i++) {
      if (folders[parts[i]] && parts[i + 1]) return parts[i + 1].toLowerCase();
    }
    return "";
  }
  function resolveSlug() {
    var r = document.querySelector("[data-z47-company]");
    return ((r && r.getAttribute("data-z47-slug")) || slugFromPath() || "").toLowerCase();
  }
  function ensureChartJs(cb) {
    if (global.Chart) return cb();
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js";
    s.onload = cb;
    s.onerror = function () { chartStatus("Chart could not load. Please refresh later."); };
    (document.head || document.body).appendChild(s);
  }
  function monthLabel(iso) {
    var dt = new Date(iso + "T00:00:00");
    return dt.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  }
  function ptsToXY(pts) {
    return (pts || []).map(function (p) { return { x: p[0], y: p[1] }; });
  }
  function periodTabs() {
    return $all("[data-z47-period], [data-tenure]", root());
  }
  function canonPeriod(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    var lower = s.toLowerCase();
    if (lower === "max") return "Max";
    var map = { "1m": "1M", "6m": "6M", "1y": "1Y", "3y": "3Y", "5y": "5Y", "10y": "10Y" };
    return map[lower] || s;
  }
  function tabPeriod(el) {
    return canonPeriod(el.getAttribute("data-z47-period") || el.getAttribute("data-tenure") || "");
  }

  function historySpanDays() {
    var max = payload && payload.periods && (payload.periods.Max || payload.periods.max);
    var price = (max && max.price) || [];
    if (price.length < 2) return price.length ? 1 : 0;
    var a = new Date(price[0][0] + "T00:00:00").getTime();
    var b = new Date(price[price.length - 1][0] + "T00:00:00").getTime();
    if (!isFinite(a) || !isFinite(b) || b < a) return 0;
    return Math.round((b - a) / 86400000);
  }
  function applicablePeriods() {
    var span = historySpanDays();
    var out = [];
    TAB_ORDER.forEach(function (p) {
      if (p === "Max") {
        out.push(p);
        return;
      }
      var need = PERIOD_MIN_DAYS[p];
      if (need != null && span >= need) out.push(p);
    });
    return out;
  }
  function syncPeriodTabs() {
    var allowed = applicablePeriods();
    var allowMap = {};
    allowed.forEach(function (p) { allowMap[p] = true; });
    periodTabs().forEach(function (a) {
      var p = tabPeriod(a);
      if (!p) return;
      var show = p === "Max" || !!allowMap[p];
      a.style.display = show ? "" : "none";
      if (!show) a.classList.remove(ACTIVE);
    });
    period = canonPeriod(period);
    if (!allowMap[period]) {
      period = allowMap["1M"] ? "1M" : (allowed[0] || "Max");
    }
    periodTabs().forEach(function (a) {
      a.classList.toggle(ACTIVE, tabPeriod(a) === period && a.style.display !== "none");
    });
  }
  function wireTabs() {
    periodTabs().forEach(function (a) {
      if (a.__z47ChartPeriod) return;
      a.__z47ChartPeriod = true;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        if (a.style.display === "none") return;
        period = tabPeriod(a) || "1M";
        periodTabs().forEach(function (b) {
          b.classList.toggle(ACTIVE, b === a);
        });
        render();
      });
    });
    $all("[data-z47-series]", root()).forEach(function (a) {
      if (a.__z47ChartSeries) return;
      a.__z47ChartSeries = true;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        seriesMode = a.getAttribute("data-z47-series") || "price";
        $all("[data-z47-series]", root()).forEach(function (b) {
          b.classList.toggle(ACTIVE, b === a);
        });
        paintLegend();
        render();
      });
    });
    var ap = periodTabs().filter(function (el) { return el.classList.contains(ACTIVE); })[0];
    if (ap) period = tabPeriod(ap) || period;
    var as = $all("[data-z47-series]." + ACTIVE, root())[0];
    if (as) seriesMode = as.getAttribute("data-z47-series") || seriesMode;
  }
  function paintLegend() {
    var host = legendHost();
    if (!host) return;
    if (seriesMode === "pe") {
      host.innerHTML =
        '<label class="z47-chart-lgnd"><span class="z47-sw" style="background:' + PE_COLOR + '"></span>' +
        '<input type="checkbox" checked disabled> PE Ratio</label>';
      return;
    }
    var items = [
      ["price", priceLabel(), PRICE_COLOR, layers.price],
      ["dma50", "50 DMA", DMA50_COLOR, layers.dma50],
      ["dma200", "200 DMA", DMA200_COLOR, layers.dma200],
      ["volume", "Volume", "#707070", layers.volume]
    ];
    host.innerHTML = items.map(function (it) {
      return '<label class="z47-chart-lgnd" data-layer="' + it[0] + '">' +
        '<span class="z47-sw" style="background:' + it[2] + '"></span>' +
        '<input type="checkbox"' + (it[3] ? " checked" : "") + '> ' + it[1] +
        "</label>";
    }).join("");
    $all("input[type=checkbox]", host).forEach(function (inp) {
      inp.addEventListener("change", function () {
        var key = inp.closest("[data-layer]").getAttribute("data-layer");
        layers[key] = !!inp.checked;
        render();
      });
    });
  }
  function injectLegendCss() {
    if (document.getElementById("z47-chart-legend-css")) return;
    var st = document.createElement("style");
    st.id = "z47-chart-legend-css";
    st.textContent =
      ".price-performance-legend,.z47-chart-lgnd{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;}" +
      ".z47-chart-lgnd{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none;}" +
      ".z47-chart-lgnd input{margin:0;}" +
      ".z47-sw{width:12px;height:12px;border-radius:2px;display:inline-block;flex:0 0 auto;}";
    (document.head || document.body).appendChild(st);
  }
  function currentPack() {
    if (!payload || !payload.periods) return null;
    var key = canonPeriod(period);
    return payload.periods[key] || payload.periods.Max || payload.periods.max || payload.periods["1Y"] || null;
  }
  function priceLabel() {
    return "Price on " + ((payload && payload.exchange) || "exchange");
  }
  function chartStatus(message) {
    var el = canvas();
    if (!el) return;
    var host = el.parentNode;
    var note = host.parentNode.querySelector(".z47-chart-status");
    if (!note) {
      note = document.createElement("p");
      note.className = "z47-chart-status";
      note.setAttribute("role", "status");
      host.parentNode.insertBefore(note, host);
    }
    note.textContent = message;
  }
  function freshness(pack) {
    var pts = pack[seriesMode === "pe" ? "pe" : "price"] || [];
    if (!pts.length) return (seriesMode === "pe" ? "P/E" : "Price") + " history unavailable for this period.";
    var last = pts.map(function (p) { return p[0]; }).sort().pop();
    var stale = Date.now() - Date.parse(last + "T00:00:00Z") > 7 * 86400000;
    return "History through " + last + ((stale || payload.refresh_error || payload.error) ? " · Update delayed; showing available history." : "");
  }
  function render() {
    var el = canvas();
    if (!el || !global.Chart) return;
    var pack = currentPack();
    if (!pack) { chartStatus("Chart history unavailable."); return; }
    chartStatus(freshness(pack));

    var datasets = [];
    var scales = {
      x: {
        type: "category",
        grid: { display: false },
        ticks: {
          maxTicksLimit: 8,
          maxRotation: 0,
          autoSkip: true,
          callback: function (v) {
            var lab = this.getLabelForValue(v);
            return lab ? monthLabel(lab) : "";
          }
        }
      }
    };

    if (seriesMode === "pe") {
      var pe = pack.pe || [];
      datasets.push({
        type: "line",
        label: "PE Ratio",
        data: pe.map(function (p) { return p[1]; }),
        borderColor: PE_COLOR,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.15,
        yAxisID: "y"
      });
      scales.y = {
        position: "right",
        title: { display: true, text: "PE" },
        grid: { color: "rgba(0,0,0,0.06)" },
        ticks: { maxTicksLimit: 7 }
      };
      var labels = pe.map(function (p) { return p[0]; });
    } else {
      var price = pack.price || [];
      var labels = price.map(function (p) { return p[0]; });
      var byDate = {};
      labels.forEach(function (d, i) { byDate[d] = i; });

      function align(pts) {
        var arr = labels.map(function () { return null; });
        (pts || []).forEach(function (p) {
          var i = byDate[p[0]];
          if (i != null) arr[i] = p[1];
        });
        return arr;
      }

      if (layers.volume) {
        datasets.push({
          type: "bar",
          label: "Volume",
          data: align(pack.volume),
          backgroundColor: VOLUME_COLOR,
          borderWidth: 0,
          yAxisID: "yVol",
          order: 3
        });
      }
      if (layers.dma50) {
        datasets.push({
          type: "line",
          label: "50 DMA",
          data: align(pack.dma50),
          borderColor: DMA50_COLOR,
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.15,
          yAxisID: "y",
          order: 2
        });
      }
      if (layers.dma200) {
        datasets.push({
          type: "line",
          label: "200 DMA",
          data: align(pack.dma200),
          borderColor: DMA200_COLOR,
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.15,
          yAxisID: "y",
          order: 2
        });
      }
      if (layers.price) {
        datasets.push({
          type: "line",
          label: priceLabel(),
          data: align(pack.price),
          borderColor: PRICE_COLOR,
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.15,
          yAxisID: "y",
          order: 1
        });
      }
      scales.yVol = {
        position: "left",
        display: !!layers.volume,
        grid: { drawOnChartArea: false },
        ticks: {
          maxTicksLimit: 5,
          callback: function (v) {
            if (v >= 1e6) return (v / 1e6).toFixed(0) + "M";
            if (v >= 1e3) return (v / 1e3).toFixed(0) + "k";
            return v;
          }
        }
      };
      scales.y = {
        position: "right",
        title: { display: true, text: "Price" },
        grid: { color: "rgba(0,0,0,0.06)" },
        ticks: { maxTicksLimit: 7 }
      };
    }

    var data = { labels: labels, datasets: datasets };
    var options = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: function (items) {
              var lab = items[0] && items[0].label;
              return lab ? monthLabel(lab) + " · " + lab : "";
            }
          }
        }
      },
      scales: scales
    };

    if (chart) {
      chart.data = data;
      chart.options = options;
      chart.update();
    } else {
      var prev = global.Chart.getChart ? global.Chart.getChart(el) : null;
      if (prev) prev.destroy();
      chart = new global.Chart(el, { type: "line", data: data, options: options });
    }
  }
  function load() {
    var slug = resolveSlug();
    if (!slug) return;
    fetch(CHART_URL + encodeURIComponent(slug) + "-chart.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        if (d.slug !== slug) throw new Error("Chart company mismatch");
        payload = d;
        global.__Z47_CHART = d;
        syncPeriodTabs();
        wireTabs();
        paintLegend();
        render();
      })
      .catch(function () {
        chartStatus("Chart history is temporarily unavailable.");
      });
  }
  function boot() {
    injectLegendCss();
    wireTabs();
    paintLegend();
    ensureChartJs(load);
  }
  global.__Z47_renderCompanyChart = function () { render(); };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(window);

</script>
