<!--
  Z47 — Cap composition donut + SECTORS/CAPS toggle
  File: staging/embeds/07-cap-pie-embed.html
  Paste into .caps-consitutents HtmlEmbed ONLY (replace ALL existing code).

  Then DELETE any other HtmlEmbed in .sector-composition-playground that only
  contains the SECTORS/CAPS toggle (or old Large/Mid/Small chart). One paste here.

  Girish thresholds (in CDN JS): Large > 100000 Cr; Mid 30000-100000; Small < 30000.
-->
<style>
  .z47-cap-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:6px;
    width:100%;
    font-family:inherit;
    opacity:0;
    transition:opacity .3s ease;
  }
  .z47-cap-wrap.z47-ready{opacity:1;}
  .z47-cap-donutbox{
    position:relative;
    flex:0 0 auto;
    width:min(55%,516px);
    margin:0 auto;
  }
  .caps-consitutents,
  .caps-constitutents,
  .caps-constituents{
    height:auto !important;
  }
  .z47-cap-legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:12px 40px;
    width:100%;
    max-width:640px;
  }
  .z47-cap-leg{
    display:flex;
    align-items:flex-start;
    gap:12px;
    min-width:110px;
  }
  .z47-cap-sq{
    width:18px;
    height:18px;
    border-radius:2px;
    flex:0 0 auto;
    margin-top:2px;
  }
  .z47-cap-leg-text{display:flex;flex-direction:column;gap:6px;}
  .z47-cap-leg-name{
    font-size:15px;
    font-weight:500;
    color:#111;
    line-height:1.2;
    white-space:nowrap;
  }
  .z47-cap-leg-pct{
    font-family:Kodemono,ui-monospace,Menlo,monospace;
    font-weight:600;
    font-size:18px;
    letter-spacing:.02em;
    color:#111;
    line-height:1;
  }
  @media(max-width:720px){
    .z47-cap-donutbox{width:min(86%,420px);}
    .z47-cap-legend{gap:16px 28px;}
    .z47-cap-leg-pct{font-size:16px;}
  }
  @media(max-width:480px){
    .z47-cap-donutbox{width:min(94%,340px);}
  }
</style>
<div class="z47-cap-wrap">
  <div class="z47-cap-donutbox"><canvas id="z47-cap-donut"></canvas></div>
  <div class="z47-cap-legend" aria-label="Market cap composition"></div>
</div>
<script>
/**
 * Z47 Constituents — SECTORS / CAPS toggle + cap-donut CDN loader
 * Always close this script tag. An unclosed script eats following Webflow HTML
 * and throws SyntaxError so nothing wires.
 */
(function () {
  "use strict";
  var ACTIVE = "z47-chart-toggle-active";
  var WF_ACTIVE = "is-active";

  function capsPanel() {
    var pg = document.querySelector(".sector-composition-playground");
    if (!pg) return null;
    return (
      pg.querySelector(".caps-consitutents") ||
      pg.querySelector(".caps-constitutents") ||
      pg.querySelector(".caps-constituents") ||
      pg.querySelector("[class*='caps-cons']")
    );
  }
  function sectorPanel() {
    var pg = document.querySelector(".sector-composition-playground");
    return pg ? pg.querySelector(".sector-composition-canvas") : null;
  }
  function toggleRoot() {
    var pg = document.querySelector(".sector-composition-playground");
    return pg ? pg.querySelector(".sector-charts-toggle") : null;
  }
  function pickButtons(root) {
    var tagged = root.querySelectorAll("a[data-z47-toggle], button[data-z47-toggle]");
    if (tagged.length >= 2) return Array.prototype.slice.call(tagged);
    return Array.prototype.slice.call(root.querySelectorAll("a.chart-tabs, a[data-z47-toggle]")).slice(0, 2);
  }
  function modeFromBtn(btn) {
    var tagged = btn.getAttribute("data-z47-toggle");
    if (tagged) return tagged.toLowerCase();
    return (btn.textContent || "").toUpperCase().indexOf("CAP") >= 0 ? "caps" : "sectors";
  }
  function panelVisible(el, on) {
    if (!el) return;
    if (on) {
      el.classList.remove("hide", "actual-hide");
      el.style.removeProperty("display");
    } else {
      el.classList.add("hide");
      el.style.display = "none";
    }
  }
  function headingVisible(el, on) {
    if (!el) return;
    el.classList.remove("hide", "actual-hide", "w-hidden");
    if (on) {
      el.style.setProperty("display", "block", "important");
    } else {
      el.style.setProperty("display", "none", "important");
    }
  }
  function headingEls() {
    var h = document.querySelector(".sector-composition-header");
    if (!h) return { sectors: null, caps: null };
    return {
      sectors: h.querySelector("h5.sectors, .disclaimer-heading.sectors"),
      caps: h.querySelector("h5.mcaps, .disclaimer-heading.mcaps")
    };
  }
  function setMode(mode) {
    var sector = sectorPanel();
    var caps = capsPanel();
    var root = toggleRoot();
    if (!sector || !caps || !root) return false;
    var isSectors = mode !== "caps";
    panelVisible(sector, isSectors);
    panelVisible(caps, !isSectors);
    var hd = headingEls();
    headingVisible(hd.sectors, isSectors);
    headingVisible(hd.caps, !isSectors);
    var wrap = document.querySelector(".sector-composition-wrap");
    var liveHdr = document.querySelector(".constituent-composition > .index-header-wrap");
    if (wrap) {
      if (!isSectors) wrap.style.setProperty("padding-top", "0", "important");
      else wrap.style.removeProperty("padding-top");
    }
    if (liveHdr) {
      if (!isSectors) liveHdr.style.setProperty("margin-bottom", "0", "important");
      else liveHdr.style.removeProperty("margin-bottom");
    }
    pickButtons(root).forEach(function (btn) {
      var on = modeFromBtn(btn) === (isSectors ? "sectors" : "caps");
      btn.classList.toggle(WF_ACTIVE, on);
      btn.classList.toggle(ACTIVE, on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
    if (!isSectors) {
      if (typeof window.__Z47_capChartTryCreate === "function") window.__Z47_capChartTryCreate();
      if (window.__Z47_capChart) {
        setTimeout(function () { window.__Z47_capChart.resize(); }, 80);
      }
    }
    return true;
  }
  function wire() {
    var root = toggleRoot();
    var sector = sectorPanel();
    var caps = capsPanel();
    if (!root || !sector || !caps) return false;

    pickButtons(root).forEach(function (btn) {
      if (btn.__z47Toggle) return;
      btn.__z47Toggle = true;
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        setMode(modeFromBtn(btn));
      });
    });

    if (!window.__Z47_sectorCapToggleInit) {
      window.__Z47_sectorCapToggleInit = true;
      var initial = "sectors";
      var active = root.querySelector("." + WF_ACTIVE + ", ." + ACTIVE);
      if (active) initial = modeFromBtn(active);
      setMode(initial);
    }
    return true;
  }
  function boot() {
    wire();
    var tries = 0;
    var t = setInterval(function () {
      if (wire() || ++tries > 40) clearInterval(t);
    }, 250);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  // Cap donut: append a script element (never put a raw script tag in this file).
  (function loadCapPie() {
    if (window.__Z47_capPieLoader) return;
    window.__Z47_capPieLoader = true;
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/gh/EverythingDesign/z47-index-feed@main/staging/js/07-cap-pie.js?v=20260821a";
    s.async = true;
    s.onerror = function () {
      console.warn("[z47] failed to load 07-cap-pie.js");
    };
    (document.body || document.documentElement).appendChild(s);
  })();
})();
</script>
